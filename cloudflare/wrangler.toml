# Deploy with:
#   npm run build
#   npx wrangler login
#   npx wrangler deploy --config cloudflare/wrangler.toml
#
# Replace the route below if the domain differs. `zone_name` must be the zone
# exactly as it appears in your Cloudflare dashboard.

name = "quran-tracker"
main = "worker.js"
compatibility_date = "2026-09-18"

[[routes]]
pattern = "diinislaam.com/quran-tracker*"
zone_name = "diinislaam.com"

# Compile the built page into the Worker as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
