<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Juz Reader &amp; Recitation — Diin Islaam</title>
<meta name="description" content="Read and listen to any juz of the Qur'ān with recitation, verse by verse, and have the day's reading ticked off when it finishes.">
<meta property="og:title" content="Juz Reader &amp; Recitation — Diin Islaam">
<meta property="og:description" content="Read and listen to any juz of the Qur'ān, verse by verse.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#faf3e0">
<link rel="manifest" href="{{ROOT}}manifest.webmanifest">
<link rel="apple-touch-icon" href="{{ROOT}}icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Juz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://verses.quran.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
<!-- @site-css -->

  /* Fallback room for the fixed player; the real value is measured in JS,
     because the bar changes height as it wraps on narrow screens. */
  main{ padding:24px 0 210px; }
  .page-head{ padding:34px 20px 22px; }

  /* ---------- Controls ---------- */
  .controls{
    max-width:860px; margin:0 auto 20px; display:flex; flex-wrap:wrap; gap:14px;
    align-items:flex-end; justify-content:center;
  }
  .control{ display:flex; flex-direction:column; gap:5px; }
  .control label{
    font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--gold); font-weight:700;
  }
  .control select{
    padding:11px 13px; min-height:46px; border-radius:10px; border:1.5px solid var(--gold-soft);
    background:#fffdf6; font-family:'Cormorant Garamond', serif; font-size:16px; font-weight:700;
    color:var(--ink-brown); min-width:190px; max-width:100%;
  }
  .control select:focus{ outline:2px solid var(--green); outline-offset:1px; }
  /* Moved out of the player bar: it was making the bar a third of a phone screen. */
  .control label.follow{
    display:flex; align-items:center; gap:9px; min-height:46px; margin:0;
    font-size:16px; font-weight:600; color:var(--ink-brown); cursor:pointer;
    text-transform:none; letter-spacing:normal; white-space:nowrap;
  }
  .follow input{ accent-color:var(--green); width:20px; height:20px; }

  .notice{
    max-width:860px; margin:0 auto 20px; border-radius:12px; padding:13px 18px;
    border:1.5px solid var(--gold-soft); background:#fbf3df; color:#6b5a49; font-size:16px;
  }
  .notice-good{ background:var(--green-bg); border-color:#a9c9b9; color:var(--green-dark); font-weight:600; }

  /* ---------- Today's reading strip ---------- */
  /* Always marks TODAY, whichever juz happens to be open below — the label
     says so explicitly so that is never ambiguous. */
  .today-strip{
    max-width:860px; margin:0 auto 18px; display:flex; align-items:center;
    justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--parchment); border:1.5px solid var(--gold-soft);
    border-radius:14px; padding:14px 20px;
  }
  .today-strip .label{ margin:0; font-size:16px; color:var(--ink-brown); }
  .today-strip.done{ background:var(--green-bg); border-color:#a9c9b9; }
  .today-strip.done .label{ color:var(--green-dark); font-weight:600; }
  @media (max-width:430px){
    .today-strip{ flex-direction:column; align-items:stretch; text-align:center; }
  }

  /* ---------- Verses ---------- */
  .verses{ max-width:860px; margin:0 auto; }
  .verse{
    background:var(--parchment); border:1.5px solid rgba(169,124,37,.3); border-radius:14px;
    padding:20px; margin-bottom:14px; cursor:pointer; scroll-margin-top:90px;
    transition:border-color .15s, box-shadow .15s;
    -webkit-tap-highlight-color:rgba(46,107,88,.15);
  }
  .verse:hover{ border-color:var(--gold); }
  .verse.playing{
    border-color:var(--green); border-width:2px; background:#fdf8ea;
    box-shadow:0 6px 20px rgba(46,107,88,.18);
  }
  .verse-bar{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-bottom:1px solid rgba(169,124,37,.25); padding-bottom:9px; margin-bottom:12px; font-size:14px;
  }
  .verse-key{ color:var(--green); font-weight:700; }
  .verse-flag{
    background:var(--green); color:var(--parchment); padding:3px 12px; border-radius:30px;
    font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  }
  .verse-ar{
    font-family:'Amiri', serif; direction:rtl; text-align:right;
    font-size:clamp(22px, 6vw, 27px); line-height:2.05; color:var(--ink-navy); margin:0 0 12px;
  }
  .verse-tr{ font-size:17px; color:#5d4c3d; border-top:1px solid rgba(169,124,37,.2); padding-top:12px; margin:0; }

  /* ---------- Hifz / Mushaf page mode ---------- */
  .mushaf-page{
    background:var(--parchment); border:1.5px solid rgba(169,124,37,.3); border-radius:14px;
    padding:22px 24px 16px; margin-bottom:22px;
  }
  .mushaf-bar{
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    font-family:'Cormorant Garamond', serif; font-size:14px; font-weight:700; color:var(--gold);
    letter-spacing:.02em; border-bottom:1px solid rgba(169,124,37,.25); padding-bottom:10px; margin-bottom:16px;
  }
  .mushaf-bar .surah-tag{ font-family:'Amiri', serif; font-size:16px; }
  .surah-banner{
    text-align:center; margin:4px 0 14px; padding:10px 14px;
    border-top:1.5px solid var(--gold-soft); border-bottom:1.5px solid var(--gold-soft);
    background:rgba(169,124,37,.07);
  }
  .surah-banner .surah-name{ font-family:'Amiri', serif; font-size:21px; color:var(--ink-navy); margin:0; }
  .surah-banner .surah-name-en{
    display:block; font-family:'Marcellus'; font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--gold); margin-top:4px;
  }
  .basmala{
    font-family:'Amiri', serif; direction:rtl; text-align:center; color:var(--ink-navy);
    font-size:23px; margin:0 0 14px;
  }
  .mushaf-text{
    font-family:'Amiri', serif; direction:rtl; text-align:justify; text-align-last:center;
    font-size:clamp(20px, 4.6vw, 24px); line-height:2.35; color:var(--ink-navy); margin:0 0 8px;
  }
  .mushaf-verse{ cursor:pointer; border-radius:6px; padding:2px 0; transition:background .15s; }
  .mushaf-verse:hover{ background:rgba(169,124,37,.12); }
  .mushaf-verse.playing{ background:rgba(46,107,88,.16); }
  .ayah-marker{
    display:inline-flex; align-items:center; justify-content:center;
    width:1.7em; height:1.7em; border:1.5px solid var(--gold); border-radius:50%;
    font-size:.5em; color:var(--gold); font-weight:700; margin:0 .15em; vertical-align:middle;
  }
  .mushaf-foot{
    text-align:center; font-family:'Cormorant Garamond', serif; font-size:14px; font-weight:700;
    color:var(--gold); margin:10px 0 0; padding-top:10px; border-top:1px solid rgba(169,124,37,.2);
  }
  @media (max-width:430px){
    .mushaf-page{ padding:18px 16px 14px; }
  }

  /* ---------- Repeat (Hifz mode) ---------- */
  .lede{ margin:0; font-size:16px; color:#6b5a49; line-height:1.5; }
  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:13px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:8px;
  }
  .field select, .field input[type="number"]{
    width:100%; padding:11px 13px; min-height:44px; border-radius:10px; border:1.5px solid var(--gold-soft);
    background:#fffdf6; font-family:'Cormorant Garamond', serif; font-size:16px; color:var(--ink-brown);
  }
  .repeat-scope{ display:flex; flex-direction:column; gap:6px; }
  .radio-opt{
    display:flex; align-items:center; gap:9px; font-size:16px; color:var(--ink-brown);
    cursor:pointer; padding:5px 0;
  }
  .radio-opt input{ accent-color:var(--green); width:18px; height:18px; flex:none; }
  .repeat-range-row{ display:flex; align-items:center; gap:10px; }
  .repeat-range-row select{ flex:1; }
  .repeat-range-row span{ color:#8a7963; font-size:14px; flex:none; }
  .repeat-count-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .repeat-count-btn{
    padding:9px 16px; border-radius:30px; border:1.5px solid var(--gold-soft); background:#fffdf6;
    font-family:'Cormorant Garamond', serif; font-size:15px; font-weight:700; color:var(--ink-brown);
    cursor:pointer;
  }
  .repeat-count-btn.active{ background:var(--green); border-color:var(--green); color:var(--parchment); }
  #repeat-count-custom{ max-width:220px; }

  .reader-msg{ text-align:center; padding:48px 20px; color:#6b5a49; }
  .reader-msg p{ font-size:17px; margin:0 0 16px; }

  /* ---------- Player ---------- */
  .player{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--green-dark); color:var(--parchment);
    border-top:1px solid var(--gold); box-shadow:0 -8px 24px rgba(28,43,70,.28);
    /* env() keeps the bar above the iOS home indicator. */
    padding:9px 20px calc(11px + env(safe-area-inset-bottom, 0px));
  }
  .player-inner{ max-width:860px; margin:0 auto; }
  .player-row{ display:flex; align-items:center; gap:14px; margin-top:5px; }
  .player-buttons{ display:flex; align-items:center; gap:8px; flex:none; }
  .pbtn{
    width:44px; height:44px; border-radius:50%; border:1.5px solid rgba(250,243,224,.4);
    background:transparent; color:var(--parchment); cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .pbtn:hover:not(:disabled){ background:rgba(250,243,224,.14); }
  .pbtn:disabled{ opacity:.4; cursor:not-allowed; }
  .pbtn svg{ width:18px; height:18px; fill:currentColor; }
  .pbtn-main{
    width:52px; height:52px; background:var(--gold); border-color:var(--gold);
    color:#fffdf6;
  }
  .pbtn-main:hover:not(:disabled){ background:#8d6619; }
  .pbtn-main svg{ width:22px; height:22px; }

  .player-meta{ flex:1; min-width:0; }
  .player-meta .now{
    font-family:'Marcellus'; font-size:19px; margin:0; color:var(--parchment);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-meta .sub{
    margin:2px 0 0; font-size:14px; color:rgba(250,243,224,.72);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-seek{ display:flex; align-items:center; gap:10px; font-size:12px; color:rgba(250,243,224,.7); }
  .player-seek input{ flex:1; min-width:0; accent-color:var(--gold-soft); height:22px; }
  .player-seek span{ font-variant-numeric:tabular-nums; min-width:32px; }
  @media (max-width:430px){
    .controls{ gap:10px; }
    .control select{ min-width:0; width:100%; }
    .control{ flex:1 1 100%; }
    .verse{ padding:16px 15px; }
    .player{ padding:8px 15px calc(9px + env(safe-area-inset-bottom, 0px)); }
    .player-row{ flex-direction:column-reverse; align-items:stretch; gap:6px; }
    .player-buttons{ justify-content:center; }
    .player-meta{ text-align:center; }
    .player-meta .now{ font-size:16px; }
    /* The reciter is already named in the selector above; on a phone that
       line is just height taken from the verses. */
    .player-meta .sub{ display:none; }
  }
</style>
</head>
<body>

<!-- @header -->

<section class="page-head">
  <h1 id="page-title">Juz Reader</h1>
  <p id="page-sub">Read along while the recitation plays. Playback keeps going when you switch tabs or lock your phone.</p>
</section>

<main>
  <div class="container">

    <div class="controls">
      <div class="control">
        <label for="juz-selector">Juz</label>
        <select id="juz-selector"></select>
      </div>
      <div class="control">
        <label for="reciter-selector">Reciter</label>
        <select id="reciter-selector">
          <option value="">Loading reciters…</option>
        </select>
      </div>
      <div class="control">
        <label for="translation-selector">Translation</label>
        <select id="translation-selector">
          <option value="">Loading translations…</option>
        </select>
      </div>
      <div class="control">
        <label class="follow" for="follow-toggle">
          <input type="checkbox" id="follow-toggle" checked>
          Follow the recitation
        </label>
      </div>
      <div class="control">
        <label class="follow" for="hifz-toggle">
          <input type="checkbox" id="hifz-toggle">
          Hifz mode (Mushaf page layout)
        </label>
      </div>
    </div>

    <div class="today-strip" id="reading-status">
      <p class="label" id="reading-status-label">Mark today&rsquo;s Qur&rsquo;ān reading</p>
      <button type="button" class="btn btn-primary" id="mark-read-btn">
        <span id="mark-read-label">Mark as read</span>
      </button>
    </div>

    <div class="notice is-hidden" id="notice"></div>

    <div class="verses" id="verses">
      <div class="reader-msg">
        <div class="spinner"></div>
        <p>Loading the juz from Quran.com…</p>
      </div>
    </div>
  </div>
</main>

<div class="player" id="player">
  <div class="player-inner">
    <div class="player-seek">
      <span id="time-now">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="0.25" value="0" aria-label="Seek within the verse" disabled>
      <span id="time-total">0:00</span>
    </div>
    <div class="player-row">
      <div class="player-buttons">
        <button type="button" class="pbtn" id="prev-btn" aria-label="Previous verse" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2v12H7zm3.5 6L19 6v12z"/></svg>
        </button>
        <button type="button" class="pbtn pbtn-main" id="play-btn" aria-label="Play recitation" disabled>
          <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" class="pbtn" id="next-btn" aria-label="Next verse" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h2v12h-2zM5 18V6l8.5 6z"/></svg>
        </button>
        <button type="button" class="pbtn is-hidden" id="stop-repeat-btn" aria-label="Stop repeating">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>
      <div class="player-meta">
        <p class="now" id="now-playing">Preparing the recitation…</p>
        <p class="sub" id="now-sub"></p>
      </div>
    </div>
  </div>
</div>

<!-- Repeat, for memorization — Hifz mode only; tapping a verse there opens
     this instead of just playing it once and moving on. -->
<div class="app-overlay is-hidden" id="repeat-overlay" role="dialog" aria-modal="true" aria-labelledby="repeat-title">
  <div class="app-sheet">
    <div class="app-sheet-head">
      <h2 id="repeat-title">Repeat for memorization</h2>
      <button type="button" class="app-icon-btn" id="close-repeat-btn" aria-label="Close">&times;</button>
    </div>
    <div class="app-sheet-pad">
      <p class="lede" id="repeat-verse-label" style="margin:0 0 16px;"></p>

      <div class="field">
        <label>What to repeat</label>
        <div class="repeat-scope">
          <label class="radio-opt">
            <input type="radio" name="repeat-scope" value="verse" checked>
            This verse only
          </label>
          <label class="radio-opt">
            <input type="radio" name="repeat-scope" value="range">
            A range of verses
          </label>
          <label class="radio-opt">
            <input type="radio" name="repeat-scope" value="page">
            The whole page
          </label>
        </div>
      </div>

      <div class="field is-hidden" id="repeat-range-field">
        <label>From &mdash; to</label>
        <div class="repeat-range-row">
          <select id="repeat-range-start"></select>
          <span>to</span>
          <select id="repeat-range-end"></select>
        </div>
      </div>

      <div class="field">
        <label>How many times</label>
        <div class="repeat-count-row">
          <button type="button" class="repeat-count-btn" data-count="3">3&times;</button>
          <button type="button" class="repeat-count-btn" data-count="5">5&times;</button>
          <button type="button" class="repeat-count-btn active" data-count="10">10&times;</button>
          <button type="button" class="repeat-count-btn" data-count="0">Unlimited</button>
        </div>
        <input type="number" id="repeat-count-custom" min="1" max="99" placeholder="Or type a number">
      </div>

      <button type="button" class="btn btn-primary btn-block" id="start-repeat-btn">Start repeating</button>
    </div>
  </div>
</div>

<!--
  One audio element for the whole session. Reusing the element the listener
  first unlocked with a tap is what lets later verses start on their own,
  including on iOS; a fresh element per verse would need a new gesture.
-->
<audio id="audio" preload="auto" playsinline></audio>

<script>
(function () {
    'use strict';

    var Core = window.QuranCore;
    var API = 'https://api.quran.com/api/v4';
    var AUDIO_HOST = 'https://verses.quran.com/';
    var PAGE_SIZE = 50;
    var MAX_PAGES = 20;
    var HIDDEN = 'is-hidden';

    var PROFILE_KEY = 'quran_user_profile';
    var LOG_KEY = 'quran_reading_log';
    var PLACE_KEY = 'quran_audio_place';
    var HIFZ_KEY = 'quran_hifz_mode';

    /*
     * Every reciter Quran.com offers is listed, with these two pulled to the
     * top. Matching is by name against the API's own list rather than pinned
     * numeric ids, so nothing breaks if an id moves — and because the whole
     * list is shown, a reciter these patterns miss is still selectable.
     */
    var SUGGESTED_RECITERS = [
        { fallbackLabel: 'Mishari Rashid al-ʿAfasy', patterns: [/afas/i, /mishari/i] },
        { fallbackLabel: 'Abdurrashid Ali Sufi', patterns: [/sufi/i, /abdu?r?\s*-?\s*rashid/i] }
    ];
    /*
     * The languages offered in the Translation selector. English picks a
     * specific, well-known translation out of the many Quran.com lists for
     * it; the other languages usually have at most one, so the first (if
     * any) is used as-is. A language Quran.com does not offer is simply
     * left out of the dropdown rather than shown as broken.
     */
    var LANGUAGE_CHOICES = [
        { code: 'english', label: 'English', patterns: [/sahih\s+international/i, /saheeh\s+international/i] },
        { code: 'oromo', label: 'Oromo' },
        { code: 'amharic', label: 'Amharic' },
        { code: 'somali', label: 'Somali' }
    ];
    // Always offered, with no network call needed: id 0 doubles as "no
    // translation was requested", which loadVerses() already treats as
    // falsy, so nothing else has to special-case it.
    var NONE_TRANSLATION = { id: 0, code: 'none', label: 'Arabic only (no translation)', name: '' };

    /*
     * The 114 surah names, in order — fixed, canonical data that never
     * changes, so it is kept here rather than fetched, matched against a
     * verse's own surah number (the part of its verse_key before the colon).
     * Index 0 is left empty; surahs are numbered from 1.
     */
    var SURAH_NAMES = [
        null,
        { en: 'Al-Fatihah', ar: 'الفاتحة' }, { en: 'Al-Baqarah', ar: 'البقرة' },
        { en: "Ali 'Imran", ar: 'آل عمران' }, { en: 'An-Nisa', ar: 'النساء' },
        { en: "Al-Ma'idah", ar: 'المائدة' }, { en: "Al-An'am", ar: 'الأنعام' },
        { en: "Al-A'raf", ar: 'الأعراف' }, { en: 'Al-Anfal', ar: 'الأنفال' },
        { en: 'At-Tawbah', ar: 'التوبة' }, { en: 'Yunus', ar: 'يونس' },
        { en: 'Hud', ar: 'هود' }, { en: 'Yusuf', ar: 'يوسف' },
        { en: "Ar-Ra'd", ar: 'الرعد' }, { en: 'Ibrahim', ar: 'إبراهيم' },
        { en: 'Al-Hijr', ar: 'الحجر' }, { en: 'An-Nahl', ar: 'النحل' },
        { en: 'Al-Isra', ar: 'الإسراء' }, { en: 'Al-Kahf', ar: 'الكهف' },
        { en: 'Maryam', ar: 'مريم' }, { en: 'Taha', ar: 'طه' },
        { en: 'Al-Anbya', ar: 'الأنبياء' }, { en: 'Al-Hajj', ar: 'الحج' },
        { en: "Al-Mu'minun", ar: 'المؤمنون' }, { en: 'An-Nur', ar: 'النور' },
        { en: 'Al-Furqan', ar: 'الفرقان' }, { en: "Ash-Shu'ara", ar: 'الشعراء' },
        { en: 'An-Naml', ar: 'النمل' }, { en: 'Al-Qasas', ar: 'القصص' },
        { en: 'Al-Ankabut', ar: 'العنكبوت' }, { en: 'Ar-Rum', ar: 'الروم' },
        { en: 'Luqman', ar: 'لقمان' }, { en: 'As-Sajdah', ar: 'السجدة' },
        { en: 'Al-Ahzab', ar: 'الأحزاب' }, { en: 'Saba', ar: 'سبأ' },
        { en: 'Fatir', ar: 'فاطر' }, { en: 'Ya-Sin', ar: 'يس' },
        { en: 'As-Saffat', ar: 'الصافات' }, { en: 'Sad', ar: 'ص' },

    function readJuzFromUrl() {
        var raw = new URLSearchParams(location.search).get('juz');

        if (n >= 1 && n <= Core.JUZ_IN_CYCLE) return n;

        // No juz asked for: fall back to the one due today, if a cycle is set.
        var profile = readStore(PROFILE_KEY);
        if (profile && profile.startDate) {
            var due = Core.juzForDate(profile.startDate, Core.formatDateKey(new Date()));
            if (due) return due;
        }
        return 1;

    function todayDueJuz() {
        if (Account && Account.state.signedIn && Account.state.apiReady &&
            Account.state.settings && Account.state.settings.startDate) {
            return Core.juzForDate(Account.state.settings.startDate, todayKey());

        if (!value && readingLog[key]) return;

    function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) return '0:00';
        var m = Math.floor(seconds / 60);
        var s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;

    // --- API -----------------------------------------------------------
    async function getJson(url) {
        var response = await fetch(url);
        if (!response.ok) throw new Error('HTTP ' + response.status + ' for ' + url);
        return response.json();
    }

    /** Follow `pagination.next_page` and concatenate `key` from every page. */
    async function getAllPages(buildUrl, key, token) {
        var page = 1;
        var items = [];
        for (var i = 0; i < MAX_PAGES && page; i++) {
            var data = await getJson(buildUrl(page));
            if (token !== loadToken) return null; // superseded
            items = items.concat((data && data[key]) || []);
            page = (data && data.pagination && data.pagination.next_page) || 0;
        }
        return items;
    }

    function matchesAny(text, patterns) {
        if (!text) return false;
        return patterns.some(function (pattern) { return pattern.test(text); });
    }

    /**
     * "Arabic only" plus one entry per LANGUAGE_CHOICES language Quran.com
     * actually offers — always at least the one entry, so a failed fetch
     * degrades to the same Arabic-only reading the reader always had before
     * translations existed, rather than a broken or disabled selector.
     */
    async function resolveTranslations() {
        var options = [NONE_TRANSLATION];
        try {
            var data = await getJson(API + '/resources/translations');
            var all = (data && data.translations) || [];
            var byLanguage = {};
            all.forEach(function (t) {
                var lang = (t.language_name || '').toLowerCase();
                (byLanguage[lang] = byLanguage[lang] || []).push(t);
            });

            LANGUAGE_CHOICES.forEach(function (choice) {
                var candidates = byLanguage[choice.code] || [];
                var found = null;
                if (choice.patterns) {
                    for (var i = 0; i < candidates.length && !found; i++) {
                        if (matchesAny(candidates[i].name, choice.patterns) ||
                            matchesAny(candidates[i].author_name, choice.patterns)) {
                            found = candidates[i];
                        }
                    }
                }
                if (!found) found = candidates[0];
                if (found) {
                    options.push({
                        id: found.id, code: choice.code, label: choice.label,
                        name: found.author_name || found.name
                    });
                }
            });
        } catch (err) {
            console.error('Could not load the translation list', err);
        }
        return options;
    }

    function buildTranslationOptions(options) {
        translationSelector.innerHTML = '';
        options.forEach(function (opt) {
            var option = document.createElement('option');
            option.value = String(opt.id);
            option.textContent = opt.label;
            translationSelector.appendChild(option);
        });
    }

    function currentTranslationName() {
        var found = translationOptions.filter(function (o) { return o.id === translationId; })[0];
        return found ? found.name : '';
    }

    async function resolveReciters() {
        var data = await getJson(API + '/resources/recitations?language=en');
        var entries = ((data && data.recitations) || []).map(function (r) {
            var translated = r.translated_name && r.translated_name.name;
            var name = r.reciter_name || translated || ('Reciter ' + r.id);
            return {
                id: r.id,
                name: name,
                label: name + (r.style ? ' (' + r.style + ')' : '')
            };
        }).filter(function (r) { return r.id; });

        var suggested = [];
        var missing = [];
        SUGGESTED_RECITERS.forEach(function (wanted) {
            var found = null;
            for (var i = 0; i < entries.length; i++) {
                if (matchesAny(entries[i].name, wanted.patterns) &&
                    !suggested.some(function (s) { return s.id === entries[i].id; })) {
                    found = entries[i];
                    break;
                }
            }
            if (found) suggested.push(found);
            else missing.push(wanted.fallbackLabel);
        });

        var suggestedIds = suggested.map(function (r) { return r.id; });
        var others = entries
            .filter(function (r) { return suggestedIds.indexOf(r.id) === -1; })
            .sort(function (a, b) { return a.label.localeCompare(b.label); });

        var byId = {};
        entries.forEach(function (r) { byId[r.id] = r; });

        return { suggested: suggested, others: others, byId: byId, missing: missing };
    }

    function buildReciterOptions(index) {
        reciterSelector.innerHTML = '';

        function group(label, items) {
            if (!items.length) return;
            var optgroup = document.createElement('optgroup');
            optgroup.label = label;
            items.forEach(function (r) {
                var option = document.createElement('option');
                option.value = String(r.id);
                option.textContent = r.label;
                optgroup.appendChild(option);
            });
            reciterSelector.appendChild(optgroup);
        }

        group('Suggested', index.suggested);
        group(index.suggested.length ? 'All reciters' : 'Reciters', index.others);
    }

    /** verse_key -> absolute mp3 url for one reciter and juz. */
    async function loadAudioFiles(recitationId, juz, token) {
        var files = await getAllPages(function (page) {
            return API + '/recitations/' + recitationId + '/by_juz/' + juz +
                '?per_page=' + PAGE_SIZE + '&page=' + page;
        }, 'audio_files', token);
        if (files === null) return null;

        var byKey = {};
        files.forEach(function (file) {
            if (!file || !file.verse_key || !file.url) return;
            byKey[file.verse_key] = /^https?:\/\//.test(file.url)
                ? file.url
                : AUDIO_HOST + String(file.url).replace(/^\/+/, '');
        });
        return byKey;
    }

    /**
     * Quran.com translations embed footnote markup. Render them as text with
     * the footnote markers dropped, so nothing from the network is ever
     * injected as live HTML.

    function translationText(html) {
        var doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
        doc.querySelectorAll('sup').forEach(function (node) { node.remove(); });
        return doc.body.textContent.replace(/\s+/g, ' ').trim();

    // --- Loading -------------------------------------------------------
    function loadVerses(juz, token) {
        // page_number/juz_number/hizb_number are fetched unconditionally —
        // cheap, and it means toggling Hifz mode never needs a re-fetch.
        var query = '?words=false&fields=text_uthmani,page_number,juz_number,hizb_number&per_page=' +
            PAGE_SIZE + (translationId ? '&translations=' + translationId : '');
        return getAllPages(function (page) {
            return API + '/verses/by_juz/' + juz + query + '&page=' + page;
        }, 'verses', token);
    }

    /**
     * Groups verses into their real Mushaf pages (by page_number, already
     * ascending from the API) and lays each out as dense, justified,
     * right-to-left text with inline circular ayah markers — a surah banner
     * and Basmala wherever a surah actually starts within the juz, the same
     * way a printed Mushaf reads. Falls back to one ungrouped page if
     * page_number was not returned, rather than rendering nothing.
     */
    function renderMushafPages(verses) {
        var fragment = document.createDocumentFragment();
        var pageEl = null;
        var textEl = null;
        var pageNumber = null;
        var surahNumber = null;

        function startPage(verse) {
            // Left exactly as returned (possibly undefined) rather than
            // coerced to null: coercing it would make every verse compare
            // unequal to the *next* verse's real undefined, starting a new
            // page block per verse instead of falling back to one page
            // when Quran.com does not return page_number at all.
            pageNumber = verse.page_number;
            pageEl = document.createElement('div');
            pageEl.className = 'mushaf-page';
            if (pageNumber) pageEl.dataset.page = pageNumber;

            var bar = document.createElement('div');
            bar.className = 'mushaf-bar';
            var loc = document.createElement('span');
            var bits = [];
            if (verse.juz_number) bits.push('Juz’ ' + verse.juz_number);
            if (verse.hizb_number) bits.push('Hizb ' + verse.hizb_number);
            loc.textContent = bits.join(' · ');
            bar.appendChild(loc);
            var tag = document.createElement('span');
            tag.className = 'surah-tag';
            var info = SURAH_NAMES[Number(verse.verse_key.split(':')[0])];
            tag.textContent = info ? info.en + ' · ' + info.ar : '';
            bar.appendChild(tag);
            pageEl.appendChild(bar);

            // A fresh paragraph per page, matching a real Mushaf — but
            // surahNumber deliberately carries over, so a surah that merely
            // continues onto this page does not get a second banner and
            // Basmala as if it were starting again.
            textEl = null;
            fragment.appendChild(pageEl);
        }

        function finishPage() {
            if (!pageEl) return;
            var foot = document.createElement('p');
            foot.className = 'mushaf-foot';
            foot.textContent = pageNumber || '';
            pageEl.appendChild(foot);
        }

        verses.forEach(function (verse) {
            var parts = verse.verse_key.split(':');
            var thisSurah = Number(parts[0]);
            var ayah = Number(parts[1]);

            if (verse.page_number !== pageNumber || !pageEl) {
                finishPage();
                startPage(verse);
            }

            if (thisSurah !== surahNumber) {
                surahNumber = thisSurah;
                var info = SURAH_NAMES[thisSurah];
                var banner = document.createElement('div');
                banner.className = 'surah-banner';
                var name = document.createElement('p');
                name.className = 'surah-name';
                name.lang = 'ar';
                name.textContent = info ? info.ar : '';
                var en = document.createElement('span');
                en.className = 'surah-name-en';
                en.textContent = info ? info.en : 'Sūrah ' + thisSurah;
                name.appendChild(en);
                banner.appendChild(name);
                pageEl.appendChild(banner);

                // Every surah opens with the Basmala except At-Tawbah (9).
                if (ayah === 1 && thisSurah !== 9) {
                    var basmala = document.createElement('p');
                    basmala.className = 'basmala';
                    basmala.lang = 'ar';
                    basmala.textContent = BASMALA;
                    pageEl.appendChild(basmala);
                }
                textEl = null;
            }

            if (!textEl) {
                textEl = document.createElement('p');
                textEl.className = 'mushaf-text';
                textEl.lang = 'ar';
                pageEl.appendChild(textEl);
            }

            var span = document.createElement('span');
            span.className = 'mushaf-verse';
            span.dataset.verseKey = verse.verse_key;
            var arabic = verse.text_uthmani || verse.text_imlaei ||
                verse.text_uthmani_simple || verse.text_indopak || '';
            span.appendChild(document.createTextNode(arabic + ' '));
            var marker = document.createElement('span');
            marker.className = 'ayah-marker';
            marker.textContent = toArabicDigits(ayah);
            span.appendChild(marker);
            textEl.appendChild(span);
            verseNodes[verse.verse_key] = span;
        });

        finishPage();
        versesEl.appendChild(fragment);
    }

    function renderVerses(verses) {
        lastVerses = verses;
        versesEl.innerHTML = '';
        verseNodes = {};

        if (hifzMode) {
            renderMushafPages(verses);
        } else {
            var fragment = document.createDocumentFragment();
            verses.forEach(function (verse) {
                var card = verseCard(verse);
                verseNodes[verse.verse_key] = card;
                fragment.appendChild(card);
            });
            versesEl.appendChild(fragment);
        }

        var withTranslation = verses.some(function (v) {
            return v.translations && v.translations.length && v.translations[0].text;
        });
        var translationName = currentTranslationName();
        $('page-sub').textContent = verses.length + ' verses' +
            (withTranslation && translationName ? ' · ' + translationName : '') +
            ' · playback continues when you switch tabs or lock your phone.';

        // Switching translation (or Hifz mode) rebuilds the nodes under a
        // verse that may already be playing; carry the highlight over
        // rather than losing it.
        if (currentIndex >= 0 && playlist[currentIndex]) {
            var node = verseNodes[playlist[currentIndex].verseKey];
            if (node) {
                node.classList.add('playing');
                var flag = node.querySelector('.verse-flag');
                if (flag) flag.classList.remove(HIDDEN);
            }
        }
    }

    async function loadJuz(juz) {
        var token = ++loadToken;
        currentJuz = juz;
        juzSelector.value = String(juz);
        pageTitle.textContent = 'Juz ' + juz;
        document.title = 'Juz ' + juz + " — Qur'ān Reader — Diin Islaam";
        stopPlayback();
        stopRepeat(); // a new juz's playlist makes any repeat indices stale
        setPlayerEnabled(false);
        nowPlaying.textContent = 'Preparing the recitation…';
        nowSub.textContent = '';
        clearNotice();
        showLoading('Loading Juz ' + juz + ' from Quran.com…');

        try {
            var verses = await loadVerses(juz, token);
            if (verses === null || token !== loadToken) return;

            if (!verses.length) {
                showMessage('No verses came back for this juz.', true);
                return;
            }

            renderVerses(verses);
            await loadPlaylist(juz, token, verses);
        } catch (err) {
            if (token !== loadToken) return;
            console.error('Could not load juz ' + juz, err);
            var offline = typeof navigator !== 'undefined' && navigator.onLine === false;
            showMessage(offline
                ? 'You appear to be offline. Reconnect and try again.'
                : 'Could not reach the Quran.com API.', true);
        }
    }

    /*
     * Changing only the translation should not restart the recitation — it
     * re-fetches just the verse text and re-renders, leaving audio alone.
     */
    async function reloadTranslation() {
        var token = ++loadToken;
        try {
            var verses = await loadVerses(currentJuz, token);
            if (verses === null || token !== loadToken) return;
            renderVerses(verses);
        } catch (err) {
            console.error('Could not reload the translation', err);
        }
    }

    async function loadPlaylist(juz, token, verses) {
        if (!reciterId) {
            showNotice('Recitation is unavailable, but you can still read the juz.');
            return;
        }
        try {
            var byKey = await loadAudioFiles(reciterId, juz, token);
            if (byKey === null || token !== loadToken) return;

            playlist = [];
            verses.forEach(function (verse) {
                var url = byKey[verse.verse_key];
                if (url) playlist.push({ verseKey: verse.verse_key, url: url });
            });

            if (!playlist.length) {
                showNotice('This reciter has no audio for Juz ' + juz + '. You can still read it.');
                setPlayerEnabled(false);
                nowPlaying.textContent = 'No recitation available';
                return;
            }

            setPlayerEnabled(true);
            var resumeAt = resumeIndexFor(juz);
            setCurrent(resumeAt, false);
            nowSub.textContent = currentReciterLabel();
            if (resumeAt > 0) {
                showNotice('Continuing from where you left off — verse ' +
                    playlist[resumeAt].verseKey + '.', true);
            }
            attemptAutoplay();
        } catch (err) {
            if (token !== loadToken) return;
            console.error('Could not load the recitation', err);
            showNotice('Could not load the recitation. You can still read the juz.');
            setPlayerEnabled(false);
        }
    }

    function resumeIndexFor(juz) {
        var place = readStore(PLACE_KEY);
        if (place && Number(place.juz) === Number(juz) && place.index > 0 &&
            place.index < playlist.length) {
            return place.index;
        }
        return 0;
    }

    function currentReciterLabel() {
        var found = reciterIndex.byId[reciterId];
        return found ? found.label : '';
    }

    // --- Playback ------------------------------------------------------
    function setPlayerEnabled(enabled) {
        playBtn.disabled = !enabled;
        prevBtn.disabled = !enabled;
        nextBtn.disabled = !enabled;
        seek.disabled = !enabled;
    }

    function setCurrent(index, autoplay) {
        if (index < 0 || index >= playlist.length) return;

        Object.keys(verseNodes).forEach(function (key) {
            verseNodes[key].classList.remove('playing');
            var flag = verseNodes[key].querySelector('.verse-flag');
            if (flag) flag.classList.add(HIDDEN);
        });

        currentIndex = index;
        var item = playlist[index];
        audio.src = item.url;

        var node = verseNodes[item.verseKey];
        if (node) {
            node.classList.add('playing');
            var flag = node.querySelector('.verse-flag');
            if (flag) flag.classList.remove(HIDDEN);
            if (followToggle.checked && !document.hidden) {
                node.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }

        if (repeatState) {
            var total = repeatState.targetCount === Infinity ? '∞' : repeatState.targetCount;
            nowPlaying.textContent = 'Verse ' + item.verseKey +
                '  ·  repeat ' + (repeatState.doneCount + 1) + ' of ' + total;
        } else {
            nowPlaying.textContent = 'Verse ' + item.verseKey +
                '  ·  ' + (index + 1) + ' of ' + playlist.length;
        }
        nowPlaying.title = nowPlaying.textContent;
        nowSub.textContent = currentReciterLabel();
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === playlist.length - 1;
        writeStore(PLACE_KEY, { juz: currentJuz, index: index, verseKey: item.verseKey });
        updateMediaSession(item);

        if (autoplay) play();
    }

    // --- Repeat (Hifz mode) ---------------------------------------------
    function playlistIndexOf(verseKey) {
        for (var i = 0; i < playlist.length; i++) {
            if (playlist[i].verseKey === verseKey) return i;
        }
        return -1;
    }

    /** Every verse key on the same Mushaf page as verseKey, in reading order. */
    function versesOnSamePage(verseKey) {
        var target;
        for (var i = 0; i < lastVerses.length; i++) {
            if (lastVerses[i].verse_key === verseKey) { target = lastVerses[i].page_number; break; }
        }
        var keys = [];
        for (var j = 0; j < lastVerses.length; j++) {
            if (lastVerses[j].page_number === target) keys.push(lastVerses[j].verse_key);
        }
        return keys;
    }

    function repeatScopeValue() {
        var checked = document.querySelector('input[name="repeat-scope"]:checked');
        return checked ? checked.value : 'verse';
    }

    function chosenRepeatCount() {
        var custom = Number(repeatCountCustom.value);
        if (custom > 0) return Math.floor(custom);
        var activeBtn = document.querySelector('.repeat-count-btn.active');
        var n = activeBtn ? Number(activeBtn.dataset.count) : 10;
        return n === 0 ? Infinity : n;
    }

    function buildRepeatRangeOptions(index) {
        var item = playlist[index];
        var pageKeys = versesOnSamePage(item.verseKey).filter(function (key) {
            return playlistIndexOf(key) !== -1; // only verses that actually have audio
        });

        repeatRangeStart.innerHTML = '';
        repeatRangeEnd.innerHTML = '';
        pageKeys.forEach(function (key) {
            var opt1 = document.createElement('option');
            opt1.value = key; opt1.textContent = key;
            repeatRangeStart.appendChild(opt1);
            var opt2 = document.createElement('option');
            opt2.value = key; opt2.textContent = key;
            repeatRangeEnd.appendChild(opt2);
        });
        repeatRangeStart.value = item.verseKey;
        repeatRangeEnd.value = pageKeys[pageKeys.length - 1] || item.verseKey;
    }

    function openRepeatOverlay(index) {
        stopRepeat(); // configuring a new repeat supersedes any already running
        repeatTapIndex = index;
        repeatVerseLabel.textContent = 'Verse ' + playlist[index].verseKey;

        document.querySelector('input[name="repeat-scope"][value="verse"]').checked = true;
        repeatRangeField.classList.add(HIDDEN);
        repeatCountCustom.value = '';
        document.querySelectorAll('.repeat-count-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.count === '10');
        });

        buildRepeatRangeOptions(index);
        repeatOverlay.classList.remove(HIDDEN);
    }

    function renderRepeatStatus() {
        stopRepeatBtn.classList.toggle(HIDDEN, !repeatState);
    }

    function stopRepeat() {
        repeatState = null;
        renderRepeatStatus();
    }

    /** Called instead of the normal auto-advance while a repeat is active. */
    function advanceRepeat() {
        repeatState.cursor++;
        if (repeatState.cursor >= repeatState.indices.length) {
            repeatState.cursor = 0;
            repeatState.doneCount++;
            if (repeatState.doneCount >= repeatState.targetCount) {
                stopRepeat();
                return;
            }
        }
        setCurrent(repeatState.indices[repeatState.cursor], true);
        renderRepeatStatus();
    }

    function play() {
        var promise = audio.play();
        if (promise && promise.catch) {
            promise.catch(function (err) {
                // Autoplay was refused; the listener needs to tap play once.
                console.warn('Playback needs a tap first', err);
                setPlayIcon(false);
            });
        }
    }

    function stopPlayback() {
        try {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
        } catch (err) { /* nothing playing */ }
        setPlayIcon(false);
    }

    function setPlayIcon(playing) {
        playIcon.querySelector('path').setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
        playBtn.setAttribute('aria-label', playing ? 'Pause recitation' : 'Play recitation');
    }

    function attemptAutoplay() {
        // Browsers only allow this where the listener already has a history of
        // playing media here; otherwise the play button is right there.
        if (new URLSearchParams(location.search).get('autoplay') === '0') return;
        play();
    }

    function updateMediaSession(item) {
        if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Verse ' + item.verseKey,
                artist: currentReciterLabel(),
                album: 'Juz ' + currentJuz + " · Qur'ān Daily Tracker"
            });
        } catch (err) { /* metadata is a nicety, not required */ }
    }

    function setupMediaSession() {
        if (!('mediaSession' in navigator)) return;
        var handlers = {
            play: function () { play(); },
            pause: function () { audio.pause(); },
            previoustrack: function () { setCurrent(currentIndex - 1, true); },
            nexttrack: function () { setCurrent(currentIndex + 1, true); }
        };
        Object.keys(handlers).forEach(function (action) {
            try {
                navigator.mediaSession.setActionHandler(action, handlers[action]);
            } catch (err) { /* unsupported action */ }
        });
    }

    /*
     * The whole juz has been recited. If it is the juz that was due today,
     * tick it off so the tracker shows it without the listener going back.
     */
    function onJuzFinished() {
        writeStore(PLACE_KEY, { juz: currentJuz, index: 0, verseKey: playlist[0] && playlist[0].verseKey });
        setPlayIcon(false);

        var dueToday = todayDueJuz();
        if (!dueToday) {
            showNotice('Juz ' + currentJuz + ' finished. Set up the tracker to record it.');
            return;
        }
        if (Number(currentJuz) !== Number(dueToday)) {
            showNotice('Juz ' + currentJuz + ' finished. Today’s juz is ' + dueToday +
                ', so nothing was ticked off.');
            return;
        }

        setTodayRead(true);
        showNotice('Juz ' + currentJuz + ' finished and marked as read for today. ' +
            'Jazāk Allāhu khayran.', true);
    }

    // --- Events --------------------------------------------------------
    markReadBtn.addEventListener('click', function () {
        setTodayRead(!readingLog[todayKey()]);
    });

    playBtn.addEventListener('click', function () {
        if (audio.paused) {
            if (!audio.currentSrc && playlist.length) setCurrent(Math.max(currentIndex, 0), true);
            else play();
        } else {
            audio.pause();
        }
    });

    // Manually skipping overrides whatever the repeat had queued up next.
    prevBtn.addEventListener('click', function () { stopRepeat(); setCurrent(currentIndex - 1, true); });
    nextBtn.addEventListener('click', function () { stopRepeat(); setCurrent(currentIndex + 1, true); });

    audio.addEventListener('play', function () { setPlayIcon(true); });
    audio.addEventListener('pause', function () { setPlayIcon(false); });

    audio.addEventListener('ended', function () {
        if (repeatState) {
            advanceRepeat();
            return;
        }
        if (currentIndex < playlist.length - 1) {
            setCurrent(currentIndex + 1, true);
        } else {
            onJuzFinished();
        }
    });

    audio.addEventListener('error', function () {
        if (!audio.currentSrc) return;
        console.error('Verse audio failed', audio.currentSrc);
        // One bad file should not end the session; move along.
        if (currentIndex < playlist.length - 1) setCurrent(currentIndex + 1, true);
        else showNotice('That verse’s audio could not be played.');
    });

    audio.addEventListener('loadedmetadata', function () {
        seek.max = isFinite(audio.duration) ? audio.duration : 0;
        timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', function () {
        if (seek.dataset.dragging === '1') return;
        seek.value = audio.currentTime;
        timeNow.textContent = formatTime(audio.currentTime);
    });

    seek.addEventListener('pointerdown', function () { seek.dataset.dragging = '1'; });
    seek.addEventListener('change', function () {
        seek.dataset.dragging = '0';
        if (isFinite(audio.duration)) audio.currentTime = Number(seek.value);
    });

    versesEl.addEventListener('click', function (event) {
        var card = event.target.closest('[data-verse-key]');
        if (!card || !playlist.length) return;
        var index = playlistIndexOf(card.dataset.verseKey);
        if (index === -1) return;

        // Hifz mode is where repetition matters; a tap there asks how to
        // repeat rather than just playing the verse once and moving on.
        if (hifzMode) {
            openRepeatOverlay(index);
        } else {
            stopRepeat(); // picking a specific verse overrides a running repeat
            setCurrent(index, true);
        }
    });

    document.querySelectorAll('input[name="repeat-scope"]').forEach(function (radio) {
        radio.addEventListener('change', function () {
            repeatRangeField.classList.toggle(HIDDEN, repeatScopeValue() !== 'range');
        });
    });

    document.querySelectorAll('.repeat-count-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.repeat-count-btn').forEach(function (b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            repeatCountCustom.value = '';
        });
    });

    closeRepeatBtn.addEventListener('click', function () { repeatOverlay.classList.add(HIDDEN); });
    repeatOverlay.addEventListener('click', function (event) {
        if (event.target === repeatOverlay) repeatOverlay.classList.add(HIDDEN);
    });

    startRepeatBtn.addEventListener('click', function () {
        var scope = repeatScopeValue();
        var indices = [];

        if (scope === 'verse') {
            indices = [repeatTapIndex];
        } else if (scope === 'range') {
            var startIdx = playlistIndexOf(repeatRangeStart.value);
            var endIdx = playlistIndexOf(repeatRangeEnd.value);
            if (startIdx === -1 || endIdx === -1) return;
            if (startIdx > endIdx) { var tmp = startIdx; startIdx = endIdx; endIdx = tmp; }
            for (var i = startIdx; i <= endIdx; i++) indices.push(i);
        } else {
            versesOnSamePage(playlist[repeatTapIndex].verseKey).forEach(function (key) {
                var idx = playlistIndexOf(key);
                if (idx !== -1) indices.push(idx);
            });
        }
        if (!indices.length) return;

        repeatState = { indices: indices, targetCount: chosenRepeatCount(), doneCount: 0, cursor: 0 };
        repeatOverlay.classList.add(HIDDEN);
        setCurrent(indices[0], true);
        renderRepeatStatus();
    });

    stopRepeatBtn.addEventListener('click', function () {
        stopRepeat();
        // Otherwise the verse already sounding finishes naturally and the
        // `ended` listener, finding no repeat left, falls through to a
        // normal auto-advance — "stop" would quietly turn into "skip".
        audio.pause();
    });

    juzSelector.addEventListener('change', function (event) {
        var juz = Number(event.target.value);
        var url = new URL(location.href);
        url.searchParams.set('juz', String(juz));
        history.replaceState(null, '', url);
        loadJuz(juz);
    });

    reciterSelector.addEventListener('change', function (event) {
        var id = Number(event.target.value);
        if (!id) return;
        reciterId = id;
        writeStore('quran_reciter', id);
        var wasPlaying = !audio.paused;
        var keepIndex = currentIndex;
        loadJuz(currentJuz).then(function () {
            if (keepIndex > 0 && keepIndex < playlist.length) setCurrent(keepIndex, wasPlaying);
        });
    });

    translationSelector.addEventListener('change', function (event) {
        var raw = event.target.value;
        if (raw === '') return; // the loading placeholder, not a real choice
        translationId = Number(raw); // 0 is a real choice here: "Arabic only"
        var chosen = translationOptions.filter(function (o) { return o.id === translationId; })[0];
        writeStore('quran_translation_lang', chosen ? chosen.code : '');
        reloadTranslation();
    });

    hifzToggle.addEventListener('change', function () {
        hifzMode = hifzToggle.checked;
        writeStore(HIFZ_KEY, hifzMode);
        // A pure re-render: the fields it needs are already in lastVerses,
        // so switching modes never waits on the network.
        if (lastVerses.length) renderVerses(lastVerses);
    });

    document.addEventListener('keydown', function (event) {
        if (event.target.tagName === 'SELECT' || event.target.tagName === 'INPUT') return;
        if (event.key === ' ') { event.preventDefault(); playBtn.click(); }
        if (event.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
        if (event.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
    });

    /*
     * The bar wraps to a different height on narrow screens, so a hardcoded
     * padding either wasted space or hid the last verses behind it. Measure it.
     */
    function syncPlayerSpace() {
        if (!player || !mainEl) return;
        mainEl.style.paddingBottom = (player.offsetHeight + 26) + 'px';
    }

    if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncPlayerSpace).observe(player);
    }
    window.addEventListener('resize', syncPlayerSpace);
    window.addEventListener('orientationchange', syncPlayerSpace);
    syncPlayerSpace();

    // --- Account -------------------------------------------------------
    /* The account sheets live on the tracker; this button goes there. */
    function renderAccountButton(state) {
        if (!accountBtn) return;
        accountBtn.classList.toggle('is-hidden', !state.available);
        if (state.signedIn) {
            accountBtn.textContent = state.user.displayName || state.user.username;
            accountBtn.classList.add('signed-in');
        } else {
            accountBtn.textContent = 'Sign in';
            accountBtn.classList.remove('signed-in');
        }
    }

    if (accountBtn) {
        accountBtn.addEventListener('click', function () { location.href = '../?account=1'; });
    }
    // Settings lives on the tracker; this button goes there, same as account.
    if (menuSettingsBtn) {
        menuSettingsBtn.addEventListener('click', function () { location.href = '../?settings=1'; });
    }
    // Reminders live in the account sheet on the tracker too.
    if (menuRemindersBtn) {
        menuRemindersBtn.addEventListener('click', function () { location.href = '../?account=1'; });
    }
    if (Account) {
        Account.onChange(function (state) {
            renderAccountButton(state);
            renderReadingStatus();
        });
        Account.start(Object.keys(readingLog), null);
    }

    // --- Start ---------------------------------------------------------
    setupMediaSession();
    setPlayIcon(false);
    renderReadingStatus();

    (async function start() {
        // Both are independent network calls; kick them off together rather
        // than waiting on reciters before even asking for translations.
        var reciterPromise = resolveReciters().catch(function (err) {
            console.error('Could not load the reciter list', err);
            return { suggested: [], others: [], byId: {}, missing: [] };
        });
        var translationPromise = resolveTranslations();

        reciterIndex = await reciterPromise;
        var total = reciterIndex.suggested.length + reciterIndex.others.length;

        if (!total) {
            reciterSelector.innerHTML = '';
            var none = document.createElement('option');
            none.value = '';
            none.textContent = 'No reciters available';
            reciterSelector.appendChild(none);
            reciterSelector.disabled = true;
        } else {
            buildReciterOptions(reciterIndex);

            var remembered = readStore('quran_reciter');
            var first = (reciterIndex.suggested[0] || reciterIndex.others[0]).id;
            reciterId = reciterIndex.byId[remembered] ? remembered : first;
            reciterSelector.value = String(reciterId);

            // Only worth saying when a named reciter is absent from the whole
            // list; otherwise the list itself is the answer.
            if (reciterIndex.missing.length) {
                showNotice('Quran.com does not list ' + reciterIndex.missing.join(' or ') +
                    '. Every other reciter it offers is in the list above.');
            }
        }

        // Always has at least NONE_TRANSLATION, so the selector is never
        // empty or disabled the way the reciter one can be.
        translationOptions = await translationPromise;
        buildTranslationOptions(translationOptions);

        var rememberedLang = readStore('quran_translation_lang');
        var preferred = translationOptions.filter(function (o) { return o.code === rememberedLang; })[0];
        // Default to a translated reading (English, if Quran.com offered
        // it) rather than "Arabic only" — that stays an explicit choice.
        var defaultOption = preferred || translationOptions[1] || translationOptions[0];
        translationId = defaultOption.id;
        translationSelector.value = String(translationId);

        await loadJuz(currentJuz);
    })();
})();
</script>
</body>
</html>
